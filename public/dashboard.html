<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayLinka Dashboard</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #00E676;
    --green-dark: #00C853;
    --green-soft: rgba(0, 230, 118, 0.15);
    --black: #050505;
    --gray: #9CA3AF;
    --light: #111111;
    --white: rgba(25, 25, 25, 0.6);
    --red: #EF4444;
    --border: rgba(255, 255, 255, 0.1);
    --text-main: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--black); color: var(--text-main); min-height: 100vh;
    background-image: radial-gradient(circle at top right, rgba(0, 230, 118, 0.1), transparent 400px),
                      radial-gradient(circle at bottom left, rgba(0, 230, 118, 0.05), transparent 400px);
    background-attachment: fixed;
  }
  header {
    background: rgba(5, 5, 5, 0.8);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 10;
  }
  .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px; color: var(--text-main); }
  .logo span { color: var(--green); }
  .badge-live { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--green); font-weight: 600; }
  .dot-live { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: blink 1.5s ease-in-out infinite; box-shadow: 0 0 10px rgba(0,230,118,0.5); }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .main { padding: 32px 16px 60px; max-width: 600px; margin: 0 auto; }
  
  .link-header {
    background: var(--white); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-radius: 24px; padding: 24px; margin-bottom: 24px;
    border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .link-name { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 800; color: var(--text-main); margin-bottom: 6px; }
  .link-creator { font-size: 14px; color: var(--gray); margin-bottom: 20px; }
  .share-link-box {
    background: rgba(0,0,0,0.4); border-radius: 12px;
    padding: 12px 16px; display: flex; align-items: center; gap: 12px;
    margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.05);
  }
  .share-link-url { flex: 1; font-size: 13px; color: var(--green); font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .copy-sm {
    background: rgba(255,255,255,0.1); color: var(--text-main); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
    flex-shrink: 0; font-family: 'DM Sans', sans-serif; transition: all 0.2s;
  }
  .copy-sm:hover { background: rgba(255,255,255,0.2); }
  .wa-share {
    width: 100%; min-height: 52px; padding: 14px;
    background: #25D366; color: white; border: none;
    border-radius: 14px; font-size: 15px; font-weight: 600;
    font-family: 'DM Sans', sans-serif; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity 0.2s;
  }
  .wa-share:hover { opacity: 0.9; }
  
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  .stat {
    background: var(--white); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-radius: 20px; padding: 20px; border: 1px solid var(--border);
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
  }
  .stat-label { font-size: 13px; color: var(--gray); margin-bottom: 8px; font-weight: 500; }
  .stat-val { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; color: var(--text-main); line-height: 1; }
  .stat-val.green { color: var(--green); text-shadow: 0 0 15px rgba(0,230,118,0.2); }
  .stat-sub { font-size: 12px; color: var(--gray); margin-top: 6px; }
  
  .section-title {
    font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; margin-bottom: 16px;
    display: flex; align-items: center; justify-content: space-between; color: var(--text-main);
  }
  .refresh-btn {
    background: rgba(255,255,255,0.05); border: 1px solid var(--border); cursor: pointer;
    color: var(--text-main); font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 20px;
    font-family: 'DM Sans', sans-serif; display: flex; align-items: center; gap: 6px; transition: all 0.2s;
  }
  .refresh-btn:hover { background: rgba(255,255,255,0.1); }
  
  .payment-card {
    background: var(--white); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-radius: 16px; padding: 16px 20px; border: 1px solid var(--border);
    margin-bottom: 12px; display: flex; align-items: center; gap: 16px;
    transition: transform 0.2s;
  }
  .payment-card:hover { transform: translateX(4px); }
  .payment-avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--green-soft); color: #4ADE80;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700; flex-shrink: 0; font-family: 'Syne', sans-serif;
  }
  .payment-info { flex: 1; min-width: 0; }
  .payment-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; color: var(--text-main); }
  .payment-phone { font-size: 13px; color: var(--gray); }
  .payment-receipt { font-size: 12px; color: var(--green); font-family: monospace; margin-top: 2px; }
  .payment-right { text-align: right; flex-shrink: 0; }
  .payment-amount { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 16px; color: var(--text-main); }
  .payment-time { font-size: 12px; color: var(--gray); margin-top: 4px; }
  .status-pill { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; margin-top: 6px; }
  .pill-success { background: var(--green-soft); color: #4ADE80; }
  .pill-pending { background: rgba(245,158,11,0.1); color: #FCD34D; }
  .pill-failed { background: rgba(239,68,68,0.1); color: #F87171; }
  
  .empty-state {
    background: rgba(0,0,0,0.3); border-radius: 20px; padding: 48px 24px; text-align: center;
    border: 1px dashed rgba(255,255,255,0.2); margin-top: 16px;
  }
  .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
  .empty-text { font-size: 15px; color: var(--gray); line-height: 1.5; }
  
  .loading-row { background: var(--white); border-radius: 16px; padding: 20px; border: 1px solid var(--border); margin-bottom: 12px; display: flex; gap: 16px; align-items: center; }
  .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  .error-state { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); border-radius: 16px; padding: 24px; text-align: center; font-size: 15px; color: #F87171; }
</style>
</head>
<body>
<header>
  <div class="logo">Pay<span>Linka</span></div>
  <div class="badge-live"><div class="dot-live"></div> Live</div>
</header>

<div class="main">
  <div id="content">
    <div class="loading-row">
      <div class="skeleton" style="width:40px;height:40px;border-radius:50%;flex-shrink:0"></div>
      <div style="flex:1"><div class="skeleton" style="height:14px;width:60%;margin-bottom:8px"></div><div class="skeleton" style="height:11px;width:40%"></div></div>
    </div>
    <div class="stats-grid">
      <div class="stat"><div class="skeleton" style="height:12px;width:70%;margin-bottom:8px"></div><div class="skeleton" style="height:28px;width:50%"></div></div>
      <div class="stat"><div class="skeleton" style="height:12px;width:70%;margin-bottom:8px"></div><div class="skeleton" style="height:28px;width:50%"></div></div>
      <div class="stat"><div class="skeleton" style="height:12px;width:70%;margin-bottom:8px"></div><div class="skeleton" style="height:28px;width:50%"></div></div>
      <div class="stat"><div class="skeleton" style="height:12px;width:70%;margin-bottom:8px"></div><div class="skeleton" style="height:28px;width:50%"></div></div>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const linkId = params.get('id');
const token = params.get('token');

if (!linkId || !token) {
  document.getElementById('content').innerHTML =
    '<div class="error-state">Invalid dashboard link. Please use the link you saved when creating your payment link.</div>';
}

function timeAgo(dateStr) {
  const diff = (Date.now() - new Date(dateStr + 'Z')) / 1000;
  if (diff < 60) return 'Just now';
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  return new Date(dateStr + 'Z').toLocaleDateString('en-KE', { day:'numeric', month:'short' });
}

function initials(name) {
  if (!name || name === 'Anonymous') return '?';
  return name.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
}

async function loadDashboard() {
  try {
    const res = await fetch(`/api/links/${linkId}/payments?token=${token}`);
    if (res.status === 403) {
      document.getElementById('content').innerHTML =
        '<div class="error-state">Access denied. Token is invalid or expired.</div>';
      return;
    }
    const { link, payments, stats } = await res.json();
    const payUrl = `${window.location.origin}/pay/${link.id}`;

    document.title = `${link.title} — Dashboard | PayLinka`;

    const successPayments = payments.filter(p => p.status === 'success');

    document.getElementById('content').innerHTML = `
      <div class="link-header">
        <div class="link-name">${link.title}</div>
        <div class="link-creator">by ${link.creator_name} · Ksh ${link.amount.toLocaleString()} per payment</div>
        <div class="share-link-box">
          <div class="share-link-url">${payUrl}</div>
          <button class="copy-sm" onclick="copyUrl('${payUrl}', this)">Copy</button>
        </div>
        <button class="wa-share" onclick="shareWA('${payUrl}', '${link.title}')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.117.554 4.103 1.523 5.824L.057 23.75l6.088-1.596A11.94 11.94 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 01-5.001-1.367l-.359-.213-3.72.976.993-3.629-.234-.373A9.817 9.817 0 012.182 12c0-5.422 4.396-9.818 9.818-9.818 5.422 0 9.818 4.396 9.818 9.818 0 5.422-4.396 9.818-9.818 9.818z"/></svg>
          Share on WhatsApp
        </button>
      </div>

      <div class="stats-grid">
        <div class="stat">
          <div class="stat-label">Total collected</div>
          <div class="stat-val green">Ksh ${(stats.total_collected || 0).toLocaleString()}</div>
          <div class="stat-sub">Net after fees</div>
        </div>
        <div class="stat">
          <div class="stat-label">Payments received</div>
          <div class="stat-val">${stats.successful || 0}</div>
          <div class="stat-sub">successful</div>
        </div>
        <div class="stat">
          <div class="stat-label">Your earnings</div>
          <div class="stat-val green">Ksh ${(stats.total_collected || 0).toLocaleString()}</div>
          <div class="stat-sub">goes to you</div>
        </div>
        <div class="stat">
          <div class="stat-label">Total attempts</div>
          <div class="stat-val">${stats.total_attempts || 0}</div>
          <div class="stat-sub">${stats.total_attempts > 0 ? Math.round((stats.successful / stats.total_attempts) * 100) : 0}% success rate</div>
        </div>
      </div>

      <div class="section-title">
        Payments (${successPayments.length})
        <button class="refresh-btn" onclick="loadDashboard()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
          Refresh
        </button>
      </div>

      ${successPayments.length === 0 ? `
        <div class="empty-state">
          <div class="empty-icon">📭</div>
          <div class="empty-text">No payments yet. Share your link to start collecting!</div>
        </div>
      ` : successPayments.map(p => `
        <div class="payment-card">
          <div class="payment-avatar">${initials(p.payer_name)}</div>
          <div class="payment-info">
            <div class="payment-name">${p.payer_name || 'Anonymous'}</div>
            <div class="payment-phone">${p.payer_phone}</div>
            ${p.mpesa_receipt ? `<div class="payment-receipt">${p.mpesa_receipt}</div>` : ''}
          </div>
          <div class="payment-right">
            <div class="payment-amount">Ksh ${p.net_amount.toLocaleString()}</div>
            <div class="payment-time">${timeAgo(p.paid_at || p.created_at)}</div>
            <div><span class="status-pill pill-success">Paid</span></div>
          </div>
        </div>
      `).join('')}
    `;
  } catch (err) {
    document.getElementById('content').innerHTML =
      '<div class="error-state">Failed to load dashboard. Please check your connection and refresh.</div>';
  }
}

function copyUrl(url, btn) {
  navigator.clipboard.writeText(url).then(() => {
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
  });
}

function shareWA(url, title) {
  const text = encodeURIComponent(`Pay *${title}* via M-Pesa:\n${url}`);
  window.open(`https://wa.me/?text=${text}`, '_blank');
}

if (linkId && token) {
  loadDashboard();
  setInterval(loadDashboard, 30000);
}
</script>
</body>
</html>

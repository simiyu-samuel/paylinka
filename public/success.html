<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Successful — PayLinka</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #00E676;
    --green-dark: #00C853;
    --green-soft: rgba(0, 230, 118, 0.15);
    --black: #050505;
    --gray: #9CA3AF;
    --light: #111111;
    --white: rgba(25, 25, 25, 0.6);
    --border: rgba(255, 255, 255, 0.1);
    --text-main: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--black); color: var(--text-main); min-height: 100vh;
    background-image: radial-gradient(circle at top right, rgba(0, 230, 118, 0.1), transparent 400px),
                      radial-gradient(circle at bottom left, rgba(0, 230, 118, 0.05), transparent 400px);
    background-attachment: fixed;
  }
  header {
    background: rgba(5, 5, 5, 0.8);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px; color: var(--text-main); }
  .logo span { color: var(--green); }
  .main { padding: 48px 20px 60px; max-width: 500px; margin: 0 auto; text-align: center; }
  .check-circle {
    width: 96px; height: 96px; border-radius: 50%;
    background: var(--green-soft); border: 2px solid var(--green);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 32px;
    animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 0 30px rgba(0,230,118,0.3);
  }
  .check-circle svg { width: 48px; height: 48px; stroke: var(--green); }
  @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  h1 { font-family: 'Syne', sans-serif; font-size: 32px; font-weight: 800; margin-bottom: 12px; color: var(--text-main); }
  .sub { font-size: 16px; color: var(--gray); margin-bottom: 40px; line-height: 1.6; }
  .receipt {
    background: var(--white); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-radius: 24px; border: 1px solid var(--border); overflow: hidden;
    margin-bottom: 32px; text-align: left; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }
  .receipt-header {
    background: rgba(0,0,0,0.4); padding: 20px 24px;
    display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border);
  }
  .receipt-header-text { color: var(--text-main); }
  .receipt-title { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; }
  .receipt-sub { font-size: 13px; color: var(--gray); margin-top: 2px; }
  .receipt-body { padding: 24px; }
  .receipt-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px dashed var(--border);
    font-size: 15px;
  }
  .receipt-row:last-child { border-bottom: none; }
  .receipt-row span:first-child { color: var(--gray); }
  .receipt-row span:last-child { font-weight: 600; color: var(--text-main); }
  .receipt-row.success span:last-child { color: #4ADE80; }
  .btn-home {
    width: 100%; min-height: 56px; padding: 16px;
    background: rgba(255,255,255,0.1); color: var(--text-main);
    border: 1px solid var(--border); border-radius: 14px;
    font-size: 16px; font-family: 'Syne', sans-serif;
    font-weight: 700; cursor: pointer; text-decoration: none;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .btn-home:hover { background: rgba(255,255,255,0.15); transform: translateY(-2px); }
  .confetti { position: fixed; pointer-events: none; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; }
</style>
</head>
<body>
<header>
  <div class="logo">Pay<span>Linka</span></div>
  <div style="font-size:12px;color:#6B7280">Secure M-Pesa</div>
</header>

<canvas class="confetti" id="confetti"></canvas>

<div class="main">
  <div class="check-circle">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#00C853" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
  </div>

  <h1>Payment received!</h1>
  <p class="sub" id="greeting">Your M-Pesa payment was processed successfully.</p>

  <div class="receipt">
    <div class="receipt-header">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
      <div class="receipt-header-text">
        <div class="receipt-title">M-Pesa Receipt</div>
        <div class="receipt-sub" id="receiptDate">—</div>
      </div>
    </div>
    <div class="receipt-body">
      <div class="receipt-row success">
        <span>Status</span>
        <span>Paid ✓</span>
      </div>
      <div class="receipt-row">
        <span>Receipt No.</span>
        <span id="receiptNo" style="font-family:monospace">—</span>
      </div>
      <div class="receipt-row">
        <span>Paid by</span>
        <span id="payerNameDisplay">—</span>
      </div>
      <div class="receipt-row">
        <span>Payment for</span>
        <span id="linkTitle">—</span>
      </div>
    </div>
  </div>

  <a href="/" class="btn-home">Make another payment link →</a>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const linkId = window.location.pathname.split('/success/')[1];
const receipt = params.get('receipt');
const name = params.get('name');

if (receipt) {
  document.getElementById('receiptNo').textContent = receipt;
}
if (name && name !== 'Anonymous') {
  document.getElementById('payerNameDisplay').textContent = name;
  document.getElementById('greeting').textContent = `Thank you ${name}! Your M-Pesa payment was processed successfully.`;
} else {
  document.getElementById('payerNameDisplay').textContent = 'Anonymous';
}

document.getElementById('receiptDate').textContent = new Date().toLocaleString('en-KE', {
  day: 'numeric', month: 'short', year: 'numeric',
  hour: '2-digit', minute: '2-digit'
});

async function loadLink() {
  try {
    const res = await fetch(`/api/links/${linkId}/public`);
    const data = await res.json();
    document.getElementById('linkTitle').textContent = data.title;
    document.title = `Paid — ${data.title} | PayLinka`;
  } catch (e) {}
}
loadLink();

function launchConfetti() {
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const pieces = Array.from({ length: 80 }, () => ({
    x: Math.random() * canvas.width,
    y: -20,
    r: Math.random() * 6 + 3,
    d: Math.random() * 80 + 20,
    color: ['#00C853', '#0A0A0A', '#A5D6A7', '#FFFFFF', '#FFD700'][Math.floor(Math.random() * 5)],
    tilt: Math.random() * 10 - 10,
    tiltAngle: 0,
    tiltAngleInc: Math.random() * 0.1 + 0.05,
    speed: Math.random() * 3 + 1,
  }));
  let frame = 0;
  const animate = () => {
    frame++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.tiltAngle += p.tiltAngleInc;
      p.y += p.speed;
      p.tilt = Math.sin(p.tiltAngle) * 15;
      ctx.beginPath();
      ctx.lineWidth = p.r;
      ctx.strokeStyle = p.color;
      ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
      ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
      ctx.stroke();
    });
    if (frame < 200) requestAnimationFrame(animate);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  };
  requestAnimationFrame(animate);
}
launchConfetti();
</script>
</body>
</html>
